<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    PalMod mark: rounded "PM" drawn as outlined bubble letters.

    Each letter is a stroked skeleton rather than an outline path: a thick
    round-capped stroke in the accent gradient, with a slightly thinner black
    stroke over the top. The gap between the two widths becomes the visible
    edge, which keeps the shapes correct at every size without hand-fitting
    bezier outlines.
  -->
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2ff3e4"/>
      <stop offset="38%" stop-color="#2ff3e4"/>
      <stop offset="68%" stop-color="#ff21cf"/>
      <stop offset="100%" stop-color="#ff21cf"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="#0b0c0f"/>

  <!-- Letter skeletons, shared by the edge pass and the fill pass. -->
  <defs>
    <g id="letters" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!--
        Each letter is one continuous path. Drawing the stem and bowl as
        separate shapes leaves an internal seam where the second shape's black
        fill eats the first one's edge; a single path has no interior boundary,
        and the loop the path encloses becomes the counter once stroked.
      -->
      <path id="p-body" d="M98 396 V 118 H 158 A 58 58 0 0 1 158 234 H 98"/>
      <path id="m-body" d="M276 396 V 214 L 347 306 L 418 214 V 396"/>
    </g>
  </defs>

  <!-- Edge pass: the coloured outline. -->
  <g fill="none" stroke="url(#edge)" stroke-width="76" stroke-linecap="round" stroke-linejoin="round">
    <use href="#p-body"/>
    <use href="#m-body"/>
  </g>

  <!-- Fill pass: black interior, leaving the edge showing. -->
  <g fill="none" stroke="#0b0c0f" stroke-width="62" stroke-linecap="round" stroke-linejoin="round">
    <use href="#p-body"/>
    <use href="#m-body"/>
  </g>
</svg>
